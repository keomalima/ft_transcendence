services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - NODE_ENV=development
    networks:
      - transcendence
    volumes:
      - prisma-data:/app/data
      - ./backend:/app
      - /app/node_modules

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      - backend
    ports:
      - "8000:80"
      - "8443:443"
    networks:
      - transcendence

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - API_BASE_URL=https://localhost:8443
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run start"
    networks:
      - transcendence

networks:
  transcendence:
    driver: bridge

volumes:
  prisma-data:
