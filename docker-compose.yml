services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
      - "5555:5555"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - NODE_ENV=production
    networks:
      - transcendence
    volumes:
      - prisma-data:/app/data

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      - backend
    ports:
      - "8000:80"
      - "8443:443"
    networks:
      - transcendence

networks:
  transcendence:
    driver: bridge

volumes:
  prisma-data:
