services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - NODE_ENV=development
    volumes:
      - prisma-data:/app/data
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend

networks:
  transcendence:
    driver: bridge

volumes:
  prisma-data:
